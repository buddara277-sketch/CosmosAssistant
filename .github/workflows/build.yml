name: Build Cosmos Assistant APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize llama.kt submodule
        run: git submodule update --init libs/llama.kt

      - name: Initialize native submodules
        run: |
          git -C libs/llama.kt submodule update --init \
            third_party/llama.cpp \
            third_party/OpenCL-Headers \
            third_party/OpenCL-ICD-Loader

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
  uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-35" \
            "platforms;android-36" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Configure native tools
        run: |
          echo "$ANDROID_HOME/ndk/27.2.12479018/shader-tools/linux-x86_64" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y build-essential patch ninja-build

      - name: Prepare llama.kt native sources
        working-directory: libs/llama.kt
        run: |
          bash scripts/bootstrap.sh
          bash scripts/build-opencl.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CosmosAssistant-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
